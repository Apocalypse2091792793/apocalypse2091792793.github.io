<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>个人简介</title>
    <style>
        <body>{
        font-family:楷体,KaiTi,serif;
        text-align:center;
        padding:50px;
        }
        #home {
                display: block;
            }
        h1{color:#1a3a6b;text-align:center;}
        p{color:#666;text-align:center;}
        table {
                margin: 0 auto;
                width: 500px;
                background: white;
                border-collapse: collapse;
                border-radius: 10px;
                overflow: hidden;
            }
                td {
                padding: 15px 20px;
                border-bottom: 1px solid #eee;
            }
        
            td:last-child {
                border-bottom: none;
            }
        .label {
                color: #1a3a6b;
                font-weight: bold;
                width: 120px;
            }
        #liuyan {
                display: none;
            }
        .box {
                width: 500px;
                margin: 30px auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            }
        
            textarea {
                width: 100%;
                height: 150px;
                padding: 15px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-family: 楷体, KaiTi, serif;
                font-size: 16px;
                box-sizing: border-box;
                resize: none;
            }
        
            button {
                margin-top: 15px;
                width: 100%;
                padding: 12px;
                background-color: #1a3a6b;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
            }
        
            button:hover {
                background-color: #2a4a7b;
            }
        
            .switch-btn {
                display: block;
                text-align: center;
                color: #1a3a6b;
                font-size: 18px;
                text-decoration: none;
                margin-top: 25px;
                cursor: pointer;
                background: none;
                border: none;
                width: auto;
                margin-left: auto;
                margin-right: auto;
            }
        
            .switch-btn:hover {
                text-decoration: underline;
                background: none;
            }
    </style>
</head>

<body>
    <div id="home">
        <h1>
            1-05 个人信息
        </h1>
        <table>
            <tr>
                <td class="label">姓名</td>
                <td>星期五</td>
            </tr>
            <tr>
                <td class="label">年龄</td>
                <td>18</td>
            </tr>
            <tr>
                <td class="label">城市</td>
                <td>江苏-南京</td>
            </tr>
            <tr>
                <td class="label">职业</td>
                <td>野人</td>
            </tr>
            <tr>
                <td class="label">技能</td>
                <td>程序设计</td>
            </tr>
            <tr>
                <td class="label">关于我</td>
                <td>一个擅长程序设计的野人</td>
            </tr>
            <tr>
                <td class="label">联系方式</td>
                <td>邮箱：Friday@163.com/电话:111</td>
            </tr>
        </table>
        <button class="switch-btn" onclick="showLiuyan()">💬 给我留言</button>
    </div>
    <div id="liuyan">
        <h1>💬 留言板</h1>
        <div class="box">
            <textarea placeholder="写下你想对我说的话..."></textarea>
            <button onclick="saveTxt()">发送留言</button>
            <button class="switch-btn" onclick="showHome()" style="margin-top:20px;">← 返回首页</button>
        </div>
    </div>

    <script>
        function showLiuyan() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('liuyan').style.display = 'block';
        }
        
        function showHome() {
            document.getElementById('liuyan').style.display = 'none';
            document.getElementById('home').style.display = 'block';
        }
              function saveTxt() {
            var text = document.querySelector('textarea').value;
            if (text == '') {
        alert('请先输入内容！');
        return;
            }
            var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '留言.txt';
            link.click();
        }
    </script>
</body>

</html>
